schema: 1
contract: MON-0025-agentforge-to-monday-transmutation
task: >
  Transmutar integralmente AgentForge a Monday, consolidando identidad operativa,
  arquitectura, CLI canónica scripts/monday.py, subagentes oficiales monday-*,
  contratos y gobernanza, preservando el valor funcional y los cambios de trabajo preexistentes.
status: DONE
verified: true

route:
  - "Route: L4 · STANDARD · risk high · delegate + review(DEEP monday-reviewer)"

delegations:
  - "Agy (Antigravity IDE): orquestación, transmutación de código y pruebas -> accepted"
  - "Claude Code (monday-reviewer): revisión independiente Gate G8/G9 -> accepted"

what_changed: >
  Transmutación integral de identidad y arquitectura a Monday:
  1. CLI canónica scripts/monday.py implementando tier, role, validate, check-scope, cap y init.
  2. scripts/af.py reducido a forwarder shim con advertencia de deprecación hacia scripts/monday.py.
  3. Creación de subagentes oficiales monday-reviewer, monday-scout, monday-worker en adapters/claude-code/agents/ y eliminación de af-*.md.
  4. Migración de metadatos y contratos a .monday/, con init --migrate-legacy seguro y sin dereferenciar symlinks.
  5. Catálogo capabilities/catalog.yaml hardened contra inyección en CWD (sin shell=True, cwd=ROOT).
  6. Suite determinista tests/test_monday.py con pruebas independientes de precedencia y migración.
  7. install.sh con auditoría --check, desinstalación y purga segura verificada con readlink -f.
  8. Preservación íntegra de Git, sin commits/push y conservando reporte histórico AF-0024.

