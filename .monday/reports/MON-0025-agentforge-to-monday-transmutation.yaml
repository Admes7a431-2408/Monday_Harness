remaining_risks:
  - "La URL remota en GitHub conserva AgentForge hasta que el usuario decida renombrar el repositorio de forma remota."

follow_up_recommendations:
  - "Actualizar la configuración global de usuario en ~/.claude/CLAUDE.md para invocar monday-* en lugar de af-*."

learnings:
  - "El chequeo de capacidades debe ejecutar comandos en el contexto seguro de ROOT y sin shell=True para evitar inyección de comandos arbitrarios desde catálogos no confiables en CWD."
  - "shutil.copytree debe usarse con symlinks=True y auditoría previa de destinos para evitar dereferenciar enlaces simbólicos que apunten fuera del repositorio."
