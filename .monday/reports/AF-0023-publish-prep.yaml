contract: AF-0023-publish-prep
task: >
  Preparar AgentForge para su primera publicación v0.1.0 en GitHub:
  ampliar install.sh con soporte reversible (--uninstall y --help) e idempotente,
  asegurar que af.py init cree la estructura completa (.agentforge/contracts y reports),
  reforzar .gitignore para distribución limpia, añadir VERSION (0.1.0) y CHANGELOG.md,
  corregir adapters/claude-code/README.md para reflejar symlinks en vez de copias,
  crear README.md completo para usuarios externos con arquitectura, lifecycle y quickstart,
  y añadir tests deterministas en tests/test_agentforge.py para init y reversibilidad.
status: DONE
verified: true

route:
  - "Route: L2 · STANDARD · risk medium · delegate(Claude Code) + verify/review(Antigravity)"

delegations:
  - "Claude Code (sonnet/medium) ejecutó la implementación de archivos permitidos."

what_changed: >
  1. install.sh: se añadieron flags --uninstall (remueve solo enlaces symlink propios de AgentForge),
     -h/--help para ayuda y validación de argumentos, preservando idempotencia y modo --dry-run.
  2. scripts/af.py: cmd_init ahora crea los directorios .agentforge/contracts y .agentforge/reports
     junto con .agentforge/CONTEXT.md.
  3. tests/test_agentforge.py: 6 pruebas unitarias añadidas (4 para install.sh --help/roundtrip/foreign/dry-run
     y 2 para af.py init), totalizando 44 pruebas automatizadas.
  4. .gitignore: cobertura estándar para Python, cachés, virtualenvs, editores, SO (.DS_Store) y .env.
  5. VERSION y CHANGELOG.md: creados para v0.1.0 siguiendo Keep a Changelog.
  6. adapters/claude-code/README.md: documenta creación de enlaces simbólicos (SSOT) en lugar de copias.
  7. README.md: guía completa para usuarios con diagramas ASCII de arquitectura, ciclo de vida,
     tabla de niveles L0-L5, flujo de trabajo, instalación SSOT, quickstart, reversibilidad y limitaciones.
  8. .agentforge/CONTEXT.md: aclara política de reversibilidad de install.sh.

files_affected:
  - install.sh
  - scripts/af.py
  - tests/test_agentforge.py
  - .gitignore
  - VERSION
  - CHANGELOG.md
  - README.md
  - adapters/claude-code/README.md
  - .agentforge/CONTEXT.md

