what_changed: >
  Estado inicial (heredado y conservado): 5 archivos modificados sin confirmar (install.sh --check/--purge-legacy,
  af.py is_safe_rel_path y detección de symlinks, profiles.yaml sin 'existing', README del adaptador, 26 tests);
  56 tests OK; install.sh --check sano. Defectos corregidos en esta ejecución, cada uno con un test que fallaba antes:
  (1) af.py: el relleno con espacios evadía la validación de rutas (" /etc/passwd", " ../x", "\t..\\x", "src/ .. /x");
      ahora se valida la cadena original, su forma efectiva (glob_re hace strip) y cada segmento sin espacios.
  (2) af.py: un scope mal tipado (string, [123], [null], lista en vez de mapping) producía Traceback; ahora scope_lists()
      lo reporta como error en validate y como error de configuración (código 2) en check-scope.
  (3) af.py check-scope: un symlink interno cuyo destino real caía en excluded_areas o fuera de allowed pasaba G5;
      ahora es "SECURITY VIOLATION (symlink resolves out of scope)" y cuenta como fuera de alcance.
  (4) af.py check-scope: el contrato y los entregables exentos (reporte, memoria) se excluían antes de los chequeos de seguridad;
      un reporte o contrato enlazado fuera del repo daba pass. Ahora se comprueban antes de excluirlos (hallazgo del revisor).
  (5) af.py check-scope: falso positivo de "symlink escape" con nombres legítimos que empiezan por ".." ("..notes/"); relpath normalizado a '/'.
  (6) install.sh --purge-legacy: validaba y borraba objetivo por objetivo; con reviewer.md regular y scout.md como symlink
      borraba reviewer.md antes de abortar. Ahora tiene 3 fases: precondiciones sin tocar nada (incluye que los archivos sean legibles),
      respaldo de todos en un directorio nuevo (mkdir atómico) verificado con cmp, y borrado con rm -f
      revalidando cada archivo y comprobando que desapareció. Si un borrado falla → INCOMPLETA y código 1.
  (7) install.sh: rm sin -f preguntaba en archivos 444 y, si se respondía "n", informaba éxito (hallazgo del revisor; reproducido con pty).
  (8) install.sh: para purgar, antes solo se miraba el destino del enlace; ahora agent_ok exige un archivo regular legible
      cuyo frontmatter declare name: igual al nombre, que es lo que registra Claude Code. --check usa la misma comprobación.
  (9) install.sh: se rechazan la purga sobre un ~/.claude/agents enlazado y las combinaciones de --check/--purge-legacy con flags de plataforma;
      --check usa python3 -B.
  (10) Docs: docs/usage.md ofrecía scout/worker/reviewer como alternativa y la plantilla report.yaml usaba "scout";
      el bloque de git clone del README tenía un enlace Markdown, con lo que el comando copiado no funcionaba;
      se documentan --check, --purge-legacy y sus garantías reales; CHANGELOG [Unreleased].

